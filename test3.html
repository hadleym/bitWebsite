<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The BIT Comedy Network</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon (optional – replace with your real one later) -->
    <link rel="icon" type="image/x-icon" href="images/favicon.png">

    <!-- Your stylesheet -->
    <link rel="stylesheet" type="text/css" href="css/style.css">

    <!-- Font Awesome (optional, for social icons if you want them) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <header class="hero">
        <div class="hero-inner">
            <h1>The BIT Comedy Network</h1>
            <p>Original comedy podcasts from Billy Merritt and the BIT Crew.</p>
        </div>
    </header>

<section id="mainstage" class="section">
    <header class="section-header">
        <h2>Mainstage</h2>
        <p>Our flagship shows, together in one place.</p>
    </header>

    <div class="mainstage-tile-group">
        <!-- Main (parent) tile -->
        <a href="https://external-mainstage-link.example.com"
           target="_blank"
           class="mainstage-tile mainstage-tile--main">
            <img src="images/mainstage-main.png" alt="Mainstage" />
            <span class="mainstage-tile-label">Mainstage Hub</span>
        </a>

        <!-- Child tile 1 -->
        <a href="https://external-mainstage-link.example.com"
           target="_blank"
           class="mainstage-tile mainstage-tile--child">
            <img src="images/mainstage-child1.png" alt="Show 1" />
            <span class="mainstage-tile-label">Show 1</span>
        </a>

        <!-- Child tile 2 -->
        <a href="https://external-mainstage-link.example.com"
           target="_blank"
           class="mainstage-tile mainstage-tile--child">
            <img src="images/mainstage-child2.png" alt="Show 2" />
            <span class="mainstage-tile-label">Show 2</span>
        </a>

        <!-- Child tile 3 -->
        <a href="https://external-mainstage-link.example.com"
           target="_blank"
           class="mainstage-tile mainstage-tile--child">
            <img src="images/mainstage-child3.png" alt="Show 3" />
            <span class="mainstage-tile-label">Show 3</span>
        </a>

        <!-- Child tile 4 -->
        <a href="https://external-mainstage-link.example.com"
           target="_blank"
           class="mainstage-tile mainstage-tile--child">
            <img src="images/mainstage-child4.png" alt="Show 4" />
            <span class="mainstage-tile-label">Show 4</span>
        </a>
    </div>
</section>

    <!-- FOOTER -->
    <footer id="main-footer">
        <p>&copy; 2025 The BIT Comedy Network&trade;</p>
    </footer>

</body>

</html>
